name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: rafaelnobre00/tppe-ci:latest
      options: --user root
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          uv sync

      - name: Lint with Ruff
        run: make ruff

      - name: Run tests
        run: |
          cp .env.example .env
          make test